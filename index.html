<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venkatesh Trading Corporation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Top Bar */
.topbar {
    background: #0b1f3a;
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 14px;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: white;
}

.logo {
    font-weight: bold;
    color: #d32f2f;
    font-size: 22px;
}

.nav-links a {
    margin: 0 15px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
}

.nav-links a:hover {
    color: red;
}

/* Hero Section */
.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px;
    background: #1e3c72;
    color: white;
}

.hero-text {
    max-width: 50%;
}

.hero-text h1 {
    font-size: 50px;
    margin-bottom: 20px;
}

.hero-text p {
    font-size: 18px;
    margin-bottom: 20px;
}

/* Buttons */
.btn {
    padding: 12px 20px;
    border: none;
    cursor: pointer;
    margin-right: 10px;
    font-weight: bold;
}

.btn-red {
    background: red;
    color: white;
}

.btn-outline {
    background: transparent;
    border: 2px solid white;
    color: white;
}

/* Image */
.hero img {
    width: 400px;
    border-radius: 15px;
}

/* Responsive */
@media (max-width: 768px) {
    .hero {
        flex-direction: column;
        text-align: center;
    }

    .hero-text {
        max-width: 100%;
    }

    .hero img {
        width: 100%;
        margin-top: 20px;
    }
}
</style>

</head>

<body>

<div class="topbar">
Serving industries across Maharashtra since 1988
</div>

<div class="navbar">
<div class="logo">VTC</div>

<div class="nav-links">
<a href="#">Home</a>
<a href="#about">About</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</div>
</div>

<div class="hero">
<div class="hero-text">
<h1>Reliable Supply.<br>Responsible Trade.</h1>

<p>
Venkatesh Trading Corporation delivers dependable industrial products
with trusted service and consistent performance.
</p>

<button class="btn btn-red">View Products</button>
<button class="btn btn-outline">Get Quote</button>
</div>

<img src="https://images.unsplash.com/photo-1581092918056-0c4c3acd3789" alt="pipes">

</div>

</body>
</html>
